<p>离毕业还有整整一年，研究生阶段的学习也逐渐进入尾声。我开始认真思考：毕业后，我想做什么？走学术还是去工业界？往哪个方向努力？</p>
<p>这是一篇写给自己的文章。也许它不完美，但它记录了我一路走来，不断试图理解自己、理解世界，并最终做出决定的过程。</p>

v></template><template><div class="vp-blog-post-item" data-allow-mismatch data-v-57f6a91b data-v-1271c988><!----><div class="blog-post-item-content" data-v-1271c988><h3 data-v-1271c988><!----><!----><!----><a class="vp-link link" href="/article/12yjuoys/" data-v-1271c988><!--[-->R Basics<!--]--><!----></a></h3><div class="post-meta" data-v-1271c988><div class="category-list" data-v-1271c988><span class="icon vpi-folder" data-v-1271c988></span><!--[--><!--[--><a class="vp-link link" href="/blog/categories/?id=0c32af" data-v-1271c988><!--[-->数学及科学计算软件<!--]--><!----></a><!----><!--]--><!--]--></div><!----><div class="create-time" data-v-1271c988><span class="icon vpi-clock" data-v-1271c988></span><span data-v-1271c988>2021-02-19</span></div></div><!----></div></div></template><template><div class="vp-blog-post-item" data-allow-mismatch data-v-57f6a91b data-v-1271c988><!----><div class="blog-post-item-content" data-v-1271c988><h3 data-v-1271c988><!----><!----><!----><a class="vp-link link" href="/article/kbs4urlf/" data-v-1271c988><!--[-->数据库概论复习<!--]--><!----></a></h3><div class="post-meta" data-v-1271c988><div class="category-list" data-v-1271c988><span class="icon vpi-folder" data-v-1271c988></span><!--[--><!--[--><a class="vp-link link" href="/blog/categories/?id=8ca608" data-v-1271c988><!--[-->数据库<!--]--><!----></a><!----><!--]--><!--]--></div><!----><div class="create-time" data-v-1271c988><span class="icon vpi-clock" data-v-1271c988></span><span data-v-1271c988>2021-01-08</span></div></div><!----></div></div></template><template><div class="vp-blog-post-item" data-allow-mismatch data-v-57f6a91b data-v-1271c988><!----><div class="blog-post-item-content" data-v-1271c988><h3 data-v-1271c988><!----><!----><!----><a class="vp-link link" href="/article/p9c1jk3f/" data-v-1271c988><!--[-->一份不知是否应称为&quot;关于&quot;的博客规划<!--]--><!----></a></h3><div class="post-meta" data-v-1271c988><div class="category-list" data-v-1271c988><span class="icon vpi-folder" data-v-1271c988></span><!--[--><!--[--><a class="vp-link link" href="/blog/categories/?id=3b3c16" data-v-1271c988><!--[-->杂记<!--]--><!----></a><!----><!--]--><!--]--></div><!----><div class="create-time" data-v-1271c988><span class="icon vpi-clock" data-v-1271c988></span><span data-v-1271c988>2020-08-24</span></div></div><div class="vp-doc excerpt" data-v-1271c988><p>当初建站的时候，我对这个博客其实也没有一个明确的规划。“关于”页面我不知道要写些什么，于是只是留下了一个建站日期。细心的朋友也许会发现，我的主页只有一个标题，也没有填写网站简介。</p>
